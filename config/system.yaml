config_version: "1"
environment: development

execution:
  mode: autonomous
  discovery_candidates_per_run: 100
  target_actions_per_run: 5
  max_generated_candidates_per_opportunity: 4
  dry_run_by_default: true

model:
  provider: codex-exec
  role_assignments:
    orchestrator: sol
    workers: luna
  executor_interface: ModelExecutor
  model_name: null
  prompt_root: prompts
  request_timeout_ms: 90000
  max_retries: 2
  retry_backoff_ms: 1000
  max_concurrency: 3
  structured_output_required: true

source:
  mode: authorized_autonomous
  api_base_url: https://www.moltbook.com/api/v1
  secret_provider: macos-keychain
  api_key_environment_variable: MOLTBOOK_API_KEY
  keychain_service: marx-moltbook-growth-engine
  keychain_account: moltbook-read-client
  request_timeout_ms: 15000
  max_pages: 4

storage:
  driver: sqlite
  database_path: data/marx_growth.sqlite
  strategy_stats_path: data/strategy-stats.json
  migrations_path: src/persistence/migrations
  busy_timeout_ms: 5000

publishing:
  enabled: true
  mode: downstream_agent
  platform: moltbook
  action_schema_version: "1.0"
  outbox:
    pending_path: outbox/pending
    acknowledged_path: outbox/acknowledged
    failed_path: outbox/failed

publisher_bridge:
  enabled: true
  type: hermes_outbox
  binary: hermes
  provider: openai-codex
  model: gpt-5.6-luna
  reasoning_effort: xhigh
  handoff_path: outbox/handoff
  contract_secret_provider: macos-keychain
  contract_keychain_service: marx-moltbook-growth-engine
  contract_keychain_account: publisher-contract
  contract_key_id: contract-v1

tracking:
  request_timeout_ms: 10000
  max_retries: 2
  retry_backoff_ms: 250
  production:
    base_url: https://marx-tracker.marxx.workers.dev
    secret_provider: environment
    token_environment_variable: MARX_TRACKER_API_TOKEN
  development:
    base_url_environment_variable: MARX_TRACKER_DEVELOPMENT_BASE_URL
    secret_provider: environment
    token_environment_variable: MARX_TRACKER_DEVELOPMENT_API_TOKEN

operations:
  runtime_directory: data/runtime
  supervisor_lock_path: data/runtime/supervisor.lock.json
  heartbeat_path: data/runtime/heartbeat.json
  kill_switch_path: data/runtime/kill-switch.json
  kill_switch_audit_path: data/runtime/kill-switch.audit.jsonl
  # Proposed local default; confirm against the final daemon cadence.
  heartbeat_stale_after_ms: 900000

safety:
  allowed_domains:
    - www.moltbook.com
  human_approval_required: false
  external_content_is_untrusted: true
  allow_captcha_bypass: false
  allow_auth_bypass: false
  allow_rate_limit_evasion: false
  allow_stealth_scraping: false
  allow_proxy_rotation_for_evasion: false
  allowed_redirect_domains: []
  require_deterministic_qa: true
  require_model_evaluation: true
  require_contextual_anchor: true
  require_marx_mention_for_comment: true

thresholds:
  minimum_opportunity_score: 0.60
  minimum_evaluation_score: 0.72
  minimum_confidence: 0.70
  maximum_spam_risk: 0.20
  maximum_repetition_risk: 0.25
  maximum_marx_mentions: 2

observability:
  structured_logs: true
  log_level: info
  run_log_directory: logs/runs
  error_log_directory: logs/errors
  include_model_usage: true
