name: Clone verification
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run setup
      - run: npm run typecheck
      - run: npm test
      - run: npm run cli -- run --fixture ./tests/fixtures/moltbook.json --dry-run
      - run: npm run cli -- daemon --once --fixture ./tests/fixtures/moltbook.json --dry-run
      - name: Remember the verified Node 22 executable
        run: echo "MARX_GROWTH_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bootstrap and help with a different shell Node version
        run: |
          npm run setup
          npm run live -- --help
